<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediFind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <a href="{{ url_for('index') }}">MediFind</a>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('register') }}" class="nav-button">
                Register
            </a>
        </div>

    </nav>
</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue using MediFind
        </p>


        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="primary-button full-width">
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create an account
            </a>
        </p>

    </div>

</main>


<footer>
    <p>© 2026 MediFind</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
